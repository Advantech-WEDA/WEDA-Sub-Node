# Azure DevOps Pipeline for Weda SubDevice
# Build + Test (non-blocking) + Optional Coverage

trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    exclude:
      - README.md
      - docs/**
      - .gitignore

pr:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - .gitignore

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  testResultsDirectory: '$(Build.ArtifactStagingDirectory)/TestResults'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test, Coverage (Non-blocking)'
        pool:
          name: 'CI Agent Pool'

        steps:
          # Install .NET SDK
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: $(dotnetVersion)
              includePreviewVersions: true

          # Restore — use the repo nuget.config so the bundled Weda.Dtdl
          # .nupkg under ./nuget/ is resolvable (not yet on NuGet.org)
          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'
              feedsToUse: 'config'
              nugetConfigPath: 'nuget.config'

          # Derive the SDK version stamped into the assemblies from the release
          # branch (release/vX.Y.Z) plus a -ci.<BuildId> suffix. This is what
          # SubNodeInfo.ResolveSdkVersion() reports as `sdkVersion` in the
          # devicecfg subNode section. Non-release branches fall back to 0.0.0.
          - bash: |
              BR="$(Build.SourceBranch)"
              if [[ "$BR" =~ release/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
                BASE="${BASH_REMATCH[1]}"
              else
                BASE="0.0.0"
              fi
              SDK_VERSION="${BASE}-ci.$(Build.BuildId)"
              echo "Derived SDK version: ${SDK_VERSION} (branch: ${BR})"
              echo "##vso[task.setvariable variable=sdkVersion]${SDK_VERSION}"
            displayName: 'Derive SDK version from release branch'

          # Build
          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore -p:Version=$(sdkVersion)'

          # Test (don't block pipeline)
          - task: DotNetCoreCLI@2
            displayName: 'Run tests (non-blocking)'
            continueOnError: true
            inputs:
              command: 'test'
              projects: 'tests/**/*.csproj'
              arguments: >
                --configuration $(buildConfiguration)
                --no-build
                --collect:"XPlat Code Coverage"
                --logger trx
                --settings tests/coverlet.runsettings
                --results-directory $(testResultsDirectory)
              publishTestResults: false

          # Debug（optional）
          - script: |
              echo "==== DEBUG FILES ===="
              find $(Build.SourcesDirectory) -name "*.trx" || true
              find $(Build.SourcesDirectory) -name "coverage.cobertura.xml" || true
              find $(Build.ArtifactStagingDirectory) || true
            displayName: 'Debug outputs'
            condition: succeededOrFailed()

          # Check TestResults exists
          - script: |
              if [ -d "$(testResultsDirectory)" ]; then
                echo "##vso[task.setvariable variable=hasTestResults]true"
              else
                echo "##vso[task.setvariable variable=hasTestResults]false"
              fi
            displayName: 'Check test results exists'

          # Publish test results (optional)
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: and(succeededOrFailed(), eq(variables.hasTestResults, 'true'))
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(testResultsDirectory)/**/*.trx'
              mergeTestResults: true
              failTaskOnFailedTests: false

          # Install ReportGenerator
          - task: DotNetCoreCLI@2
            displayName: 'Install ReportGenerator'
            inputs:
              command: 'custom'
              custom: 'tool'
              arguments: 'install --global dotnet-reportgenerator-globaltool'

          # Generate coverage (optional)
          - script: |
              echo "Checking coverage files..."

              FILES=$(find $(testResultsDirectory) -name "coverage.cobertura.xml")

              if [ -z "$FILES" ]; then
                echo "No coverage files found. Skipping coverage."
                exit 0
              fi

              export PATH="$PATH:$HOME/.dotnet/tools"

              reportgenerator \
                -reports:$(testResultsDirectory)/**/coverage.cobertura.xml \
                -targetdir:$(testResultsDirectory)/coveragereport \
                -reporttypes:"HtmlInline_AzurePipelines;Cobertura;Badges;MarkdownSummaryGithub" \
                -sourcedirs:$(Build.SourcesDirectory)/src
            displayName: 'Generate coverage report (optional)'

          # Check coverage exists
          - script: |
              if [ -d "$(testResultsDirectory)/coveragereport" ]; then
                echo "##vso[task.setvariable variable=hasCoverageReport]true"
              else
                echo "##vso[task.setvariable variable=hasCoverageReport]false"
              fi
            displayName: 'Check coverage report exists'

          # Publish coverage (optional)
          - publish: $(testResultsDirectory)/coveragereport
            artifact: CodeCoverageReport
            displayName: 'Publish coverage report'
            condition: and(succeededOrFailed(), eq(variables.hasCoverageReport, 'true'))

          # Publish raw TestResults (optional)
          - publish: $(testResultsDirectory)
            artifact: TestResults
            displayName: 'Publish raw test results'
            condition: and(succeededOrFailed(), eq(variables.hasTestResults, 'true'))
