services:
  WedaSubNode:
    build:
      context: ../..
      dockerfile: ${PROJECT_DIR:-apps/WedaSubNode}/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-apps/WedaSubNode}
    environment:
      # The repository keeps the password empty; supply it at run time.
      - SystemConfig__WedaNode__Password=${WEDA_NATS_PASSWORD:-}
    volumes:
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./appsettings.json:/app/appsettings.json:ro
      # The accepted registration lives here. Losing it makes the SubNode register afresh
      # and collide with its own previous registration (409 Device name already in use),
      # so the default is the on-device convention rather than a folder beside the project.
      - ${WEDA_DATA_PATH:-/opt/Advantech/weda/node/WedaSubNode}:/app/.weda
     
    network_mode: host
    restart: unless-stopped
