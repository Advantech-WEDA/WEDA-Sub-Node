services:
  daq-feature-proxy:
    build:
      context: ../..
      dockerfile: examples/daq-feature-proxy/Dockerfile
    image: daq-feature-proxy:latest
    container_name: daq-feature-proxy
    network_mode: host
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./appsettings.json:/app/appsettings.json:ro
      - ./weda-data:/app/.weda
