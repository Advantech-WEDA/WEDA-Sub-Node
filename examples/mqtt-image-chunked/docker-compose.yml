services:
  # MQTT broker for the image payloads. Host networking, not a published port: the SubNode below
  # uses host networking, and a stack that mixes the two cannot be deployed to a device - the
  # agent programs the project network's veth into the host namespace and the host-mode container
  # is created but never starts, with no logs at all.
  #
  # The stock image ships no usable config; write a minimal anonymous listener before starting.
  # Overriding only `command:` is swallowed by the image entrypoint, so `entrypoint:` goes too.
  mqtt:
    image: eclipse-mosquitto:2
    container_name: image-sensor-mqtt
    network_mode: host
    entrypoint: ["/bin/sh","-c"]
    command: ["printf 'listener 1883 0.0.0.0\\nallow_anonymous true\\n' > /tmp/mosquitto.conf && exec mosquitto -c /tmp/mosquitto.conf"]
    restart: unless-stopped

  # ImageSensor Application
  image-sensor:
    image: ${IMAGE_SENSOR_IMAGE:-harbor.arfa.wise-paas.com/edge-coa/image-sensor:latest}
    pull_policy: always
    container_name: image-sensor-app
    network_mode: host
    restart: unless-stopped
    environment:
      # === SystemConfig.WedaNode (NATS connection to WedaNode) ===
      - SystemConfig__WedaNode__Url=${WEDA_NODE_URL:-127.0.0.1:4224}
      - SystemConfig__WedaNode__Name=${WEDA_NODE_NAME:-default}
      - SystemConfig__WedaNode__SerializerType=${WEDA_NODE_SERIALIZER_TYPE:-json}
      # AuthStrategy: None | UserPassword | Token | TlsCert | CredFile
      - SystemConfig__WedaNode__AuthStrategy=${WEDA_NODE_AUTH_STRATEGY:-UserPassword}
      - SystemConfig__WedaNode__Username=${WEDA_NODE_USERNAME:-advantech_nats}
      - SystemConfig__WedaNode__Password=${WEDA_NATS_PASSWORD:-}
      - SystemConfig__WedaNode__Token=${WEDA_NODE_TOKEN:-}
      - SystemConfig__WedaNode__CredFile=${WEDA_NODE_CRED_FILE:-}
      - SystemConfig__WedaNode__TlsCertPath=${WEDA_NODE_TLS_CERT_PATH:-}
      - SystemConfig__WedaNode__TlsKeyPath=${WEDA_NODE_TLS_KEY_PATH:-}
      - SystemConfig__WedaNode__TlsCaPath=${WEDA_NODE_TLS_CA_PATH:-}
      # === SystemConfig.Record (local recording quota) ===
      - SystemConfig__Record__MinFreeDiskSpaceMb=${RECORD_MIN_FREE_DISK_SPACE_MB:-128}
      - SystemConfig__Record__MaxStorageSizeMb=${RECORD_MAX_STORAGE_SIZE_MB:-1024}
      - SystemConfig__Record__RetentionDays=${RECORD_RETENTION_DAYS:-7}
      # === DeviceConfig.SubNode (identity reported to WedaNode) ===
      - DeviceConfig__SubNode__Name=${SUBNODE_NAME:-ImageSensorDemo}
      - DeviceConfig__SubNode__SubNodeType=${SUBNODE_TYPE:-CustomDevice}
      - DeviceConfig__SubNode__Manufacturer=${SUBNODE_MANUFACTURER:-Advantech}
      - DeviceConfig__SubNode__Model=${SUBNODE_MODEL:-MNIST-Demo}
      - DeviceConfig__SubNode__SwVersion=${SUBNODE_SW_VERSION:-1.0.0}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      # Configuration files
      - ./appsettings.json:/app/appsettings.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      # Persist .weda directory for device registration
      - ${WEDA_DATA_PATH:-/opt/Advantech/weda/node/image-sensor}:/app/.weda
