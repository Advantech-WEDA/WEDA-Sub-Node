services:
  command-handler:
    build:
      context: ../..
      dockerfile: examples/feature-custom-commands/Dockerfile
    volumes:
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./appsettings.json:/app/appsettings.json:ro
      - ${WEDA_DATA_PATH:-/opt/Advantech/weda/node/command-handler}:/app/.weda
    network_mode: host
    restart: unless-stopped
