services:
  # MQTT Broker - Eclipse Mosquitto
  mqtt:
    image: eclipse-mosquitto:2
    container_name: image-sensor-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  # ImageSensor Application
  image-sensor:
    build:
      context: ../..
      dockerfile: examples/image-sensor/Dockerfile
    container_name: image-sensor-app
    network_mode: host
    restart: unless-stopped
    environment:
      # === SystemConfig.WedaNode (NATS connection to WedaNode) ===
      - SystemConfig__WedaNode__Url=${WEDA_NODE_URL:-127.0.0.1:4224}
      - SystemConfig__WedaNode__Name=${WEDA_NODE_NAME:-default}
      - SystemConfig__WedaNode__SerializerType=${WEDA_NODE_SERIALIZER_TYPE:-json}
      # AuthStrategy: None | UserPassword | Token | TlsCert | CredFile
      - SystemConfig__WedaNode__AuthStrategy=${WEDA_NODE_AUTH_STRATEGY:-UserPassword}
      - SystemConfig__WedaNode__Username=${WEDA_NODE_USERNAME:-advantech_nats}
      - SystemConfig__WedaNode__Password=${WEDA_NODE_PASSWORD:-}
      - SystemConfig__WedaNode__Token=${WEDA_NODE_TOKEN:-}
      - SystemConfig__WedaNode__CredFile=${WEDA_NODE_CRED_FILE:-}
      - SystemConfig__WedaNode__TlsCertPath=${WEDA_NODE_TLS_CERT_PATH:-}
      - SystemConfig__WedaNode__TlsKeyPath=${WEDA_NODE_TLS_KEY_PATH:-}
      - SystemConfig__WedaNode__TlsCaPath=${WEDA_NODE_TLS_CA_PATH:-}
      # === SystemConfig.Record (local recording quota) ===
      - SystemConfig__Record__MinFreeDiskSpaceMb=${RECORD_MIN_FREE_DISK_SPACE_MB:-128}
      - SystemConfig__Record__MaxStorageSizeMb=${RECORD_MAX_STORAGE_SIZE_MB:-1024}
      - SystemConfig__Record__RetentionDays=${RECORD_RETENTION_DAYS:-7}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      # Configuration files
      - ./appsettings.json:/app/appsettings.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      # Persist .weda directory for device registration
      - ./weda-data:/app/.weda
