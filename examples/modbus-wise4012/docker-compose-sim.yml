# Development only: runs the example against the standalone Modbus simulator on one machine.
#
# Not deployable. The simulator publishes a port while the SubNode uses host networking, which a
# device's agent cannot deploy, and the registration is kept beside the project rather than under
# /opt/Advantech. Use docker-compose.deploy.yml for a device.
services:
  simulator:
    build:
      context: ../..
      dockerfile: tools/simulator-host/Dockerfile
    ports:
      - "5020:5020"
    restart: unless-stopped

  wise-4012:
    build:
      context: ../..
      dockerfile: examples/modbus-wise4012/Dockerfile
    volumes:
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./appsettings.json:/app/appsettings.json:ro
      - ./weda-data:/app/.weda
    network_mode: host
    depends_on:
      - simulator
    restart: unless-stopped