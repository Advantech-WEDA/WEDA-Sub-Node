# CFX SubNode deployment.
#
# The SubNode subscribes to the CFX AMQP-to-MQTT bridge (RabbitMQ with rabbitmq_mqtt) and forwards
# captured messages to a WedaNode. Host networking is used so the bridge and the WedaNode can both be
# reached at their host addresses.
#
# Standing deployment:
#   docker compose up -d
#
# Smoke-test with the captured payloads (publishes onto the same bridge, then stop it again):
#   docker compose --profile replay up -d cfx-replay
#   docker compose --profile replay stop cfx-replay
#
# Secrets come from .env (gitignored); see .env.example.
services:
  # The CFX AMQP-to-MQTT bridge the SubNode subscribes to. RabbitMQ speaks AMQP 1.0 to the CFX
  # endpoints and republishes onto MQTT via rabbitmq_mqtt. It stays on the default bridge network
  # and publishes its ports, so the host-networked SubNode reaches it at 127.0.0.1:1884 while the
  # plugin keeps its own default of 1883 inside the container.
  cfx-broker:
    image: rabbitmq:3-management
    container_name: cfx-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cfx
      RABBITMQ_DEFAULT_PASS: ${CFX_BROKER_PASSWORD:?set CFX_BROKER_PASSWORD in examples/cfx-endpoint/.env}
    # The MQTT plugin is not enabled in the stock image; enable it before the broker boots.
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_amqp1_0 || true;
             exec docker-entrypoint.sh rabbitmq-server"
    ports:
      - "1884:1883"    # MQTT, the port devicecfg.json points at
      - "5672:5672"    # AMQP 1.0, where CFX endpoints publish
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cfx-subnode:
    build:
      context: ../..
      dockerfile: examples/cfx-endpoint/Dockerfile
    environment:
      # Broker and WedaNode credentials are kept out of the JSON config files. Environment variables
      # are applied after the JSON providers, so these win over the file values.
      DeviceConfig__DeviceConfigs__CfxEndpoint__DeviceCommunication__Password: ${CFX_BROKER_PASSWORD:?set CFX_BROKER_PASSWORD in examples/cfx-endpoint/.env}
      SystemConfig__WedaNode__Password: ${WEDA_NATS_PASSWORD:?set WEDA_NATS_PASSWORD in examples/cfx-endpoint/.env}
    volumes:
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./appsettings.json:/app/appsettings.json:ro
      - ${WEDA_DATA_PATH:-/opt/Advantech/weda/node/cfx-subnode}:/app/.weda
    network_mode: host
    depends_on:
      cfx-broker:
        condition: service_healthy
    restart: unless-stopped

  # Not part of the standing deployment. Replays the captured CFX payloads onto the same bridge so
  # the deployment can be verified end-to-end while the production line is idle.
  cfx-replay:
    profiles: ["replay"]
    build:
      context: ../..
      dockerfile: tools/cfx-replay/Dockerfile
    environment:
      CFX_BROKER_HOST: 127.0.0.1
      CFX_BROKER_PORT: "1884"
      CFX_BROKER_USERNAME: cfx
      CFX_BROKER_PASSWORD: ${CFX_BROKER_PASSWORD:?set CFX_BROKER_PASSWORD in examples/cfx-endpoint/.env}
      CFX_INTERVAL_MS: "700"
      CFX_CYCLE_DELAY_MS: "5000"
      CFX_LOOP: "true"
      # Restamp each envelope's TimeStamp to publish time. The captures carry the timestamps they
      # were recorded with, and the SubNode reports publisher time, so without this the telemetry
      # lands weeks in the past and no recent-window query shows it. Set false for byte-exact replay.
      CFX_RESTAMP: "true"
    network_mode: host
    restart: "no"
