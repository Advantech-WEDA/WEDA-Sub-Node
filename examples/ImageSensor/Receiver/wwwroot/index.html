<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MNIST Image Receiver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
        h1 { color: #0f9; margin-bottom: 20px; }
        .status { padding: 8px 16px; background: #16213e; border-radius: 4px; margin-bottom: 20px; }
        .status.connected { border-left: 4px solid #0f9; }
        .status.waiting { border-left: 4px solid #fa0; }
        .latest { display: flex; gap: 20px; margin-bottom: 30px; }
        .latest img {
            width: 280px; height: 280px; image-rendering: pixelated;
            border: 2px solid #333; background: #000;
        }
        .latest .info { font-size: 14px; line-height: 2; }
        .history { display: flex; flex-wrap: wrap; gap: 12px; }
        .history img {
            width: 56px; height: 56px; image-rendering: pixelated;
            border: 1px solid #333; background: #000; cursor: pointer;
        }
        .history img:hover { border-color: #0f9; }
        .history img.selected { border-color: #0f9; border-width: 2px; }
    </style>
</head>
<body>
    <h1>MNIST Image Receiver</h1>
    <div id="status" class="status waiting">Connecting...</div>

    <h2 style="margin-bottom:12px">Latest Image</h2>
    <div class="latest">
        <img id="latestImg" src="" alt="Waiting for image...">
        <div class="info" id="latestInfo">No images received yet.</div>
    </div>

    <h2 style="margin-bottom:12px">History (last 10)</h2>
    <div class="history" id="history"></div>

    <script>
        const img = document.getElementById('latestImg');
        const info = document.getElementById('latestInfo');
        const status = document.getElementById('status');
        const history = document.getElementById('history');
        let lastImageId = null;
        let imageCount = 0;

        async function poll() {
            try {
                const res = await fetch('/api/latest');
                const data = await res.json();

                if (data.available && data.imageId !== lastImageId) {
                    lastImageId = data.imageId;
                    imageCount++;
                    img.src = `data:${data.contentType};base64,${data.base64}`;
                    info.innerHTML = [
                        `<b>Sensor:</b> ${data.sensorId}`,
                        `<b>Time:</b> ${data.timestamp}`,
                        `<b>Type:</b> ${data.contentType}`,
                        `<b>Size:</b> ${data.base64.length} chars`,
                        `<b>Total received:</b> ${imageCount}`,
                    ].join('<br>');
                    status.textContent = `Connected - receiving images`;
                    status.className = 'status connected';
                    loadHistory();
                } else if (!data.available) {
                    status.textContent = 'Connected - waiting for images...';
                    status.className = 'status waiting';
                }
            } catch (e) {
                status.textContent = 'Disconnected - retrying...';
                status.className = 'status waiting';
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/images');
                const images = await res.json();
                history.innerHTML = '';
                for (const item of images) {
                    const thumb = document.createElement('img');
                    thumb.src = `/api/images/${item.imageId}`;
                    thumb.title = `${item.sensorId} - ${item.timestamp}`;
                    thumb.onclick = () => {
                        window.open(`/api/images/${item.imageId}`, '_blank');
                    };
                    history.appendChild(thumb);
                }
            } catch {}
        }

        setInterval(poll, 2000);
        poll();
    </script>
</body>
</html>
