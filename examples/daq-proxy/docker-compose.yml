services:
  daq-proxy:
    environment:
      # The NATS password is no longer stored in systemcfg.json. Supply it at run time:
      #   cp .env.example .env      (docker compose reads .env automatically)
      - SystemConfig__WedaNode__Password=${WEDA_NATS_PASSWORD:-}
    image: harbor.arfa.wise-paas.com/edge-coa/daq-proxy:latest
    container_name: daq-proxy
    network_mode: host
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./appsettings.json:/app/appsettings.json:ro
      - ${WEDA_DATA_PATH:-/opt/Advantech/weda/node/daq-proxy}:/app/.weda
