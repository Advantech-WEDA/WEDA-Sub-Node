name: $(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - examples/daq-proxy/**

variables:
  CONTAINER_REGISTRY_SERVICE_CONNECTION: 'Edge COA Harbor'
  CONTAINER_NAME: 'edgenode'
  REGISTRY_HOST: 'harbor.arfa.wise-paas.com'
  IMAGE_REPOSITORY: 'edge-coa/$(CONTAINER_NAME)/$(Build.SourceBranchName)/daq-proxy'
  IMAGE_TAG: '$(Build.BuildNumber)'
  IMAGE_PREVENT_DEPLOY_SECURITY_LEVEL: 'CRITICAL,HIGH'

stages:
- stage: Build_Image
  displayName: 'Build & Push Multi-Arch'
  jobs:
  - job: Build
    displayName: 'Build & Push Multi-Arch'
    pool:
      name: 'CI Agent Pool'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: Docker@2
      displayName: 'Login Harbor'
      inputs:
        command: 'login'
        containerRegistry: $(CONTAINER_REGISTRY_SERVICE_CONNECTION)

    - script: |
        set -euo pipefail
        docker buildx version || true
        docker buildx create --driver docker-container --use --name multiarch || docker buildx use multiarch
        docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64 || true
        docker buildx inspect --bootstrap
        docker buildx ls
      displayName: 'Setup buildx'

    - script: |
        set -euo pipefail
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -f $(Build.SourcesDirectory)/examples/daq-proxy/Dockerfile \
          -t $(REGISTRY_HOST)/$(IMAGE_REPOSITORY):latest \
          -t $(REGISTRY_HOST)/$(IMAGE_REPOSITORY):$(IMAGE_TAG) \
          $(Build.SourcesDirectory) \
          --push
      displayName: 'Build & Push Image'

    - script: |
        set -euo pipefail
        docker buildx imagetools inspect $(REGISTRY_HOST)/$(IMAGE_REPOSITORY):latest
        docker buildx imagetools inspect $(REGISTRY_HOST)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)
      displayName: 'Verify Manifest'

- stage: Scan_And_SBOM
  displayName: 'Scan & Generate SBOM'
  dependsOn: Build_Image
  jobs:
  - job: Security_Analysis
    displayName: 'Security Scan & SBOM Generation'
    pool:
      name: 'CI Agent Pool'
    steps:
    - task: Docker@2
      displayName: 'Login Harbor'
      inputs:
        command: 'login'
        containerRegistry: $(CONTAINER_REGISTRY_SERVICE_CONNECTION)

    - task: Bash@3
      displayName: 'Vulnerability Scan'
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          IMAGE_URL="$(REGISTRY_HOST)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)"
          SEVERITY_LEVEL="$(IMAGE_PREVENT_DEPLOY_SECURITY_LEVEL)"

          echo "Scanning image: $IMAGE_URL"
          echo "Severity levels: $SEVERITY_LEVEL"

          trivy image --severity "$SEVERITY_LEVEL" --exit-code 1 "$IMAGE_URL"
          if [ $? -ne 0 ]; then
            echo "Vulnerabilities found at severity levels: $SEVERITY_LEVEL"
            exit 1
          fi
          echo "No vulnerabilities found at specified severity levels"

    - script: |
        set -euo pipefail
        mkdir -p $(Build.ArtifactStagingDirectory)/sbom

        echo "Generating SBOM in SPDX format..."
        trivy image --format spdx-json \
          --output $(Build.ArtifactStagingDirectory)/sbom/sbom-spdx.json \
          $(REGISTRY_HOST)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

        echo "Generating SBOM in CycloneDX format..."
        trivy image --format cyclonedx \
          --output $(Build.ArtifactStagingDirectory)/sbom/sbom-cyclonedx.json \
          $(REGISTRY_HOST)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

        echo "Generating human-readable report..."
        trivy image --format table \
          --output $(Build.ArtifactStagingDirectory)/sbom/sbom-report.txt \
          $(REGISTRY_HOST)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)

        echo "SBOM generation completed"
        ls -lh $(Build.ArtifactStagingDirectory)/sbom/
      displayName: 'Generate SBOM'

    - script: |
        set -euo pipefail

        SUMMARY_FILE="$(Build.ArtifactStagingDirectory)/sbom/sbom-summary.md"

        echo "# 📦 SBOM Report" > "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "**Build:** \`$(IMAGE_TAG)\`" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "**Image:** \`$(REGISTRY_HOST)/$(IMAGE_REPOSITORY):$(IMAGE_TAG)\`" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "---" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "## 📊 Package Summary" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo '```' >> "$SUMMARY_FILE"
        head -n 100 $(Build.ArtifactStagingDirectory)/sbom/sbom-report.txt >> "$SUMMARY_FILE"
        echo '```' >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "---" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "## 📥 Available SBOM Formats" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "| Format | File | Description |" >> "$SUMMARY_FILE"
        echo "|--------|------|-------------|" >> "$SUMMARY_FILE"
        echo "| SPDX | \`sbom-spdx.json\` | SPDX 2.3 JSON format |" >> "$SUMMARY_FILE"
        echo "| CycloneDX | \`sbom-cyclonedx.json\` | CycloneDX JSON format |" >> "$SUMMARY_FILE"
        echo "| Text Report | \`sbom-report.txt\` | Human-readable full report |" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "> 💡 **Tip:** Download complete SBOM files from the pipeline artifacts tab above." >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "## 📄 File Information" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo '```' >> "$SUMMARY_FILE"
        ls -lh $(Build.ArtifactStagingDirectory)/sbom/ >> "$SUMMARY_FILE"
        echo '```' >> "$SUMMARY_FILE"

        cat "$SUMMARY_FILE"
        echo "##vso[task.uploadsummary]$SUMMARY_FILE"
      displayName: 'Create SBOM Summary for Pipeline UI'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish SBOM to Pipeline Artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/sbom'
        artifactName: 'SBOM'
        artifactType: 'pipeline'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish SBOM to Build Artifacts (Legacy)'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/sbom'
        ArtifactName: 'sbom-$(IMAGE_TAG)'
        publishLocation: 'Container'

- stage: Create_Git_Tag
  displayName: Create and Push Git Tag
  dependsOn: Scan_And_SBOM
  condition: succeeded()
  jobs:
  - job: TagRelease
    displayName: Tag Release
    pool:
      name: 'CI Agent Pool'
    steps:
    - checkout: self
      persistCredentials: true
      clean: true
    - task: Bash@3
      displayName: Create and push Git tag
      inputs:
        targetType: 'inline'
        script: |
          git config --global user.email "azure-pipelines@advantech.com"
          git config --global user.name "Azure Pipelines"
          TAG_NAME="daq-proxy-$(IMAGE_TAG)"
          echo "Creating tag: $TAG_NAME"
          git tag -a "$TAG_NAME" -m "Release build $(IMAGE_TAG)"
          echo "Pushing tag to origin"
          git push origin "$TAG_NAME"
          echo "Tag $TAG_NAME created and pushed successfully"
