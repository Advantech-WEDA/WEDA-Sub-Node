services:
  power-aggregation:
    build:
      context: ../..
      dockerfile: examples/feature-aggregation/Dockerfile
    volumes:
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ./appsettings.json:/app/appsettings.json:ro
      - ${WEDA_DATA_PATH:-/opt/Advantech/weda/node/power-aggregation}:/app/.weda
    network_mode: host
    restart: unless-stopped
