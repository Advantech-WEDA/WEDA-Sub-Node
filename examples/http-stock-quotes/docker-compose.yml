services:
  stock-monitor:
    build:
      context: ../..
      dockerfile: examples/http-stock-quotes/Dockerfile
    volumes:
      - ./devicecfg.json:/app/devicecfg.json:ro
      - ./systemcfg.json:/app/systemcfg.json:ro
      - ./customcfg.json:/app/customcfg.json:ro
      - ${WEDA_DATA_PATH:-/opt/Advantech/weda/node/stock-monitor}:/app/.weda
    network_mode: host
    restart: unless-stopped
